<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSI 背離訊號 — 獲利分佈分析</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0f1117;
  --card: #1a1d2e;
  --border: #2a2d3e;
  --text: #e0e0e0;
  --dim: #888;
  --green: #26a69a;
  --red: #ef5350;
  --blue: #42a5f5;
  --yellow: #ffca28;
  --purple: #ab47bc;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  min-height: 100vh;
}
.header {
  text-align: center;
  margin-bottom: 24px;
}
.header h1 {
  font-size: 1.6em;
  background: linear-gradient(135deg, var(--green), var(--blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 6px;
}
.header .meta {
  color: var(--dim);
  font-size: 0.85em;
}
.controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.btn {
  padding: 8px 18px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.85em;
  transition: all 0.2s;
}
.btn:hover { border-color: var(--blue); background: #22253a; }
.btn.active { border-color: var(--blue); background: #1e2a4a; }
.btn.refresh { border-color: var(--green); }
.btn.refresh:hover { background: #1a2e2a; }
.loading {
  text-align: center;
  padding: 60px;
  color: var(--dim);
  font-size: 1.2em;
}
.loading .spinner {
  display: inline-block;
  width: 24px;
  height: 24px;
  border: 3px solid var(--border);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
}
.card h3 {
  font-size: 0.95em;
  color: var(--dim);
  margin-bottom: 12px;
  text-align: center;
}
.chart-container {
  position: relative;
  height: 280px;
}
.stats-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85em;
}
.stats-table th, .stats-table td {
  padding: 10px 12px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}
.stats-table th {
  color: var(--dim);
  font-weight: 500;
  font-size: 0.8em;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.stats-table tr:hover { background: rgba(255,255,255,0.03); }
.pos { color: var(--green); }
.neg { color: var(--red); }
.win-bar {
  display: inline-block;
  height: 6px;
  border-radius: 3px;
  min-width: 4px;
  vertical-align: middle;
  margin-left: 6px;
}
.full-width { grid-column: 1 / -1; }
.signal-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8em;
}
.signal-table th, .signal-table td {
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
  text-align: right;
}
.signal-table th {
  color: var(--dim);
  font-weight: 500;
  position: sticky;
  top: 0;
  background: var(--card);
}
.signal-table td:first-child,
.signal-table th:first-child { text-align: left; }
.signal-scroll {
  max-height: 360px;
  overflow-y: auto;
}
.signal-scroll::-webkit-scrollbar { width: 6px; }
.signal-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.tag-buy {
  background: rgba(38,166,154,0.15);
  color: var(--green);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.85em;
}
.tag-sell {
  background: rgba(239,83,80,0.15);
  color: var(--red);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.85em;
}
.footer {
  text-align: center;
  color: var(--dim);
  font-size: 0.75em;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
</style>
</head>
<body>

<div class="header">
  <h1>RSI 背離訊號 — 獲利分佈分析</h1>
  <div class="meta" id="meta">載入中...</div>
</div>

<div class="controls">
  <button class="btn active" data-filter="all" onclick="setFilter('all')">全部訊號</button>
  <button class="btn" data-filter="buy" onclick="setFilter('buy')">買進訊號</button>
  <button class="btn" data-filter="sell" onclick="setFilter('sell')">賣出訊號</button>
  <button class="btn" data-day="profit" onclick="toggleMode('profit')" id="btnProfit"
    style="border-color:var(--green)">最大獲利</button>
  <button class="btn" data-day="drawdown" onclick="toggleMode('drawdown')" id="btnDrawdown">最大回撤</button>
  <button class="btn refresh" onclick="refreshData()">⟳ 重新整理</button>
</div>

<div id="loading" class="loading">
  <div class="spinner"></div><br>
  正在從 Yahoo Finance 載入最新資料...
</div>

<div id="content" style="display:none">
  <!-- 勝率統計 -->
  <div class="card full-width" style="margin-bottom:16px">
    <h3>勝率與報酬統計</h3>
    <div class="signal-scroll">
      <table class="stats-table" id="statsTable">
        <thead>
          <tr>
            <th>天期</th>
            <th>訊號數</th>
            <th>勝率</th>
            <th>平均最大獲利</th>
            <th>平均最大回撤</th>
            <th>中位數獲利</th>
            <th>最佳</th>
            <th>最差</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- 直方圖 -->
  <div class="grid">
    <div class="card">
      <h3 id="chart1Title">1 日 獲利分佈</h3>
      <div class="chart-container"><canvas id="chart1"></canvas></div>
    </div>
    <div class="card">
      <h3 id="chart3Title">3 日 獲利分佈</h3>
      <div class="chart-container"><canvas id="chart3"></canvas></div>
    </div>
    <div class="card">
      <h3 id="chart5Title">5 日 獲利分佈</h3>
      <div class="chart-container"><canvas id="chart5"></canvas></div>
    </div>
    <div class="card">
      <h3 id="chart10Title">10 日 獲利分佈</h3>
      <div class="chart-container"><canvas id="chart10"></canvas></div>
    </div>
    <div class="card">
      <h3 id="chart20Title">20 日 獲利分佈</h3>
      <div class="chart-container"><canvas id="chart20"></canvas></div>
    </div>
    <div class="card">
      <h3 id="chart60Title">60 日 獲利分佈</h3>
      <div class="chart-container"><canvas id="chart60"></canvas></div>
    </div>
  </div>

  <!-- 訊號明細 -->
  <div class="card full-width">
    <h3>背離訊號明細</h3>
    <div class="signal-scroll">
      <table class="signal-table" id="signalTable">
        <thead>
          <tr>
            <th>日期</th>
            <th>收盤</th>
            <th>RSI</th>
            <th>訊號</th>
            <th>1日</th>
            <th>3日</th>
            <th>5日</th>
            <th>10日</th>
            <th>20日</th>
            <th>60日</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<div class="footer">
  RSI 背離分析 | 資料來源: Yahoo Finance | 每次載入自動更新
</div>

<script>
let DATA = null;
let currentFilter = 'all';
let currentMode = 'profit'; // profit or drawdown
let charts = {};

const DAYS = [1, 3, 5, 10, 20, 60];
const DAY_COLORS = {
  1:  '#42a5f5',
  3:  '#26a69a',
  5:  '#ffca28',
  10: '#ab47bc',
  20: '#ef5350',
  60: '#ff7043',
};

// ===== 資料載入 =====
async function loadData(refresh = false) {
  const url = refresh ? '/api/refresh' : '/api/data';
  try {
    const resp = await fetch(url);
    DATA = await resp.json();
    if (DATA.error) throw new Error(DATA.error);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    document.getElementById('meta').textContent =
      `${DATA.symbol} | ${DATA.data_range} | ${DATA.total_days} 交易日 | 更新: ${DATA.last_update}`;
    renderAll();
  } catch (e) {
    document.getElementById('loading').innerHTML =
      `<span style="color:var(--red)">載入失敗: ${e.message}</span>`;
  }
}

function refreshData() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('content').style.display = 'none';
  document.getElementById('loading').innerHTML =
    '<div class="spinner"></div><br>重新抓取最新資料...';
  loadData(true);
}

// ===== 篩選 =====
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.btn[data-filter]').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === f);
  });
  renderAll();
}

function toggleMode(m) {
  currentMode = m;
  document.getElementById('btnProfit').classList.toggle('active', m === 'profit');
  document.getElementById('btnDrawdown').classList.toggle('active', m === 'drawdown');
  renderAll();
}

// ===== 取得篩選後報酬 =====
function getFiltered(day) {
  if (!DATA) return [];
  return DATA.signals
    .filter(s => {
      if (currentFilter === 'buy' && s.signal !== 1) return false;
      if (currentFilter === 'sell' && s.signal !== -1) return false;
      return s.returns[String(day)] !== null;
    })
    .map(s => {
      const r = s.returns[String(day)];
      return currentMode === 'profit' ? r.max_profit : r.max_drawdown;
    })
    .filter(v => v !== null && v !== undefined);
}

// ===== 建立直方圖 =====
function buildHistogram(values, day) {
  if (values.length === 0) return { labels: [], counts: [], colors: [] };

  // 分箱
  const minV = Math.min(...values);
  const maxV = Math.max(...values);
  const range = maxV - minV;
  const binSize = range <= 0 ? 1 : Math.max(0.2, range / 15);
  const bins = {};

  values.forEach(v => {
    const key = Math.floor(v / binSize) * binSize;
    const label = key.toFixed(1);
    bins[label] = (bins[label] || 0) + 1;
  });

  const sortedKeys = Object.keys(bins)
    .map(Number)
    .sort((a, b) => a - b);

  const labels = sortedKeys.map(k => k.toFixed(1));
  const counts = sortedKeys.map(k => bins[k.toFixed(1)]);
  const colors = sortedKeys.map(k =>
    k >= 0 ? 'rgba(38,166,154,0.7)' : 'rgba(239,83,80,0.7)'
  );

  return { labels, counts, colors };
}

function renderChart(canvasId, titleId, day) {
  const values = getFiltered(day);
  const { labels, counts, colors } = buildHistogram(values, day);

  const modeLabel = currentMode === 'profit' ? '獲利' : '回撤';
  document.getElementById(titleId).textContent =
    `${day} 日最大${modeLabel}分佈 (${values.length} 筆)`;

  const ctx = document.getElementById(canvasId).getContext('2d');

  if (charts[canvasId]) {
    charts[canvasId].destroy();
  }

  charts[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        data: counts,
        backgroundColor: colors,
        borderRadius: 3,
        barPercentage: 0.9,
        categoryPercentage: 0.95,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: (items) => `${items[0].label}%`,
            label: (item) => `${item.raw} 次`
          }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: {
            color: '#888',
            font: { size: 10 },
            maxRotation: 45,
            callback: function(val, i) {
              return this.getLabelForValue(val) + '%';
            }
          },
          title: {
            display: true,
            text: `${modeLabel}率 (%)`,
            color: '#888',
            font: { size: 11 }
          }
        },
        y: {
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: { color: '#888', stepSize: 1 },
          title: {
            display: true,
            text: '次數',
            color: '#888',
            font: { size: 11 }
          }
        }
      }
    }
  });
}

// ===== 勝率統計 =====
function renderStats() {
  const tbody = document.querySelector('#statsTable tbody');
  tbody.innerHTML = '';

  DAYS.forEach(d => {
    const buySignals = DATA.signals.filter(s => s.signal === 1 && s.returns[String(d)] !== null);
    const sellSignals = DATA.signals.filter(s => s.signal === -1 && s.returns[String(d)] !== null);

    [
      { label: `${d}日買進`, signals: buySignals, color: 'var(--green)' },
      { label: `${d}日賣出`, signals: sellSignals, color: 'var(--red)' },
    ].forEach(({ label, signals, color }) => {
      if (signals.length === 0) return;

      const profits = signals.map(s => s.returns[String(d)].max_profit);
      const drawdowns = signals.map(s => s.returns[String(d)].max_drawdown);

      // 勝率：最大獲利 > 0 的比例
      const wins = profits.filter(p => p > 0).length;
      const winRate = (wins / signals.length * 100);

      const avgProfit = profits.reduce((a, b) => a + b, 0) / profits.length;
      const avgDrawdown = drawdowns.reduce((a, b) => a + b, 0) / drawdowns.length;
      const medianProfit = profits.sort((a, b) => a - b)[Math.floor(profits.length / 2)];
      const best = Math.max(...profits);
      const worst = Math.min(...drawdowns);

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="color:${color};text-align:left;font-weight:600">${label}</td>
        <td>${signals.length}</td>
        <td>
          <span class="${winRate >= 50 ? 'pos' : 'neg'}">${winRate.toFixed(1)}%</span>
          <span class="win-bar" style="width:${winRate * 0.8}px;background:${winRate >= 50 ? 'var(--green)' : 'var(--red)'}"></span>
        </td>
        <td class="pos">+${avgProfit.toFixed(2)}%</td>
        <td class="neg">${avgDrawdown.toFixed(2)}%</td>
        <td class="${medianProfit >= 0 ? 'pos' : 'neg'}">${medianProfit >= 0 ? '+' : ''}${medianProfit.toFixed(2)}%</td>
        <td class="pos">+${best.toFixed(2)}%</td>
        <td class="neg">${worst.toFixed(2)}%</td>
      `;
      tbody.appendChild(tr);
    });
  });
}

// ===== 訊號明細 =====
function renderSignalTable() {
  const tbody = document.querySelector('#signalTable tbody');
  tbody.innerHTML = '';

  const filtered = DATA.signals.filter(s => {
    if (currentFilter === 'buy' && s.signal !== 1) return false;
    if (currentFilter === 'sell' && s.signal !== -1) return false;
    return true;
  });

  filtered.forEach(s => {
    const tr = document.createElement('tr');
    const sigTag = s.signal === 1
      ? '<span class="tag-buy">買進</span>'
      : '<span class="tag-sell">賣出</span>';

    let cells = `
      <td style="text-align:left">${s.date}</td>
      <td>${s.close.toFixed(0)}</td>
      <td>${s.rsi || 'N/A'}</td>
      <td>${sigTag}</td>
    `;

    DAYS.forEach(d => {
      const r = s.returns[String(d)];
      if (r === null) {
        cells += '<td style="color:var(--dim)">-</td>';
      } else {
        const val = currentMode === 'profit' ? r.max_profit : r.max_drawdown;
        const cls = val >= 0 ? 'pos' : 'neg';
        cells += `<td class="${cls}">${val >= 0 ? '+' : ''}${val.toFixed(1)}%</td>`;
      }
    });

    tr.innerHTML = cells;
    tbody.appendChild(tr);
  });
}

// ===== 渲染全部 =====
function renderAll() {
  if (!DATA) return;

  // 直方圖
  renderChart('chart1', 'chart1Title', 1);
  renderChart('chart3', 'chart3Title', 3);
  renderChart('chart5', 'chart5Title', 5);
  renderChart('chart10', 'chart10Title', 10);
  renderChart('chart20', 'chart20Title', 20);
  renderChart('chart60', 'chart60Title', 60);

  // 統計
  renderStats();

  // 明細
  renderSignalTable();
}

// ===== 啟動 =====
loadData();
</script>
</body>
</html>
